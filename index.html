<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="theme-color" content="#3b82f6"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Escala 6x2"/>
<title>Escala 6x2</title>
<link rel="manifest" href="manifest.json"/>
<link rel="apple-touch-icon" href="icons/icon-192.png"/>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:#f4f6fb;color:#1a1a2e;min-height:100vh;}
.app{max-width:430px;margin:0 auto;padding:0 0 80px;}

/* TOPBAR */
.topbar{background:#fff;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e8eaf0;position:sticky;top:0;z-index:10;}
.topbar-title{font-size:18px;font-weight:700;color:#1a1a2e;}
.topbar-right{display:flex;gap:10px;}
.icon-btn{background:none;border:1.5px solid #e0e4ee;border-radius:12px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:20px;}
.icon-btn:active{background:#f0f2f7;}

/* CARDS */
.section{padding:16px 14px 0;}
.section-title{font-size:12px;font-weight:600;color:#888;letter-spacing:.06em;text-transform:uppercase;margin-bottom:10px;}

.minha-cor-banner{border-radius:16px;padding:16px;margin:16px 14px 0;display:flex;align-items:center;justify-content:space-between;}
.minha-cor-info{display:flex;align-items:center;gap:12px;}
.minha-cor-dot{width:44px;height:44px;border-radius:50%;flex-shrink:0;}
.minha-cor-label{font-size:12px;color:rgba(255,255,255,.75);margin-bottom:2px;}
.minha-cor-nome{font-size:20px;font-weight:700;color:#fff;}
.minha-cor-folga{font-size:13px;font-weight:600;color:rgba(255,255,255,.9);}

.hoje-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;}
.stat-card{background:#fff;border-radius:14px;padding:14px;border:1px solid #eaecf2;}
.stat-lbl{font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.05em;margin-bottom:8px;}
.stat-val{display:flex;flex-direction:column;gap:5px;}
.cor-tag{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:500;}
.cor-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0;}

.alert-banner{border-radius:14px;padding:14px 16px;display:flex;align-items:center;gap:12px;margin:16px 14px 0;}
.alert-icon{font-size:24px;}
.alert-title{font-size:14px;font-weight:700;}
.alert-sub{font-size:12px;margin-top:2px;opacity:.8;}

/* LEGENDA */
.legenda{display:flex;gap:14px;flex-wrap:wrap;padding:10px 14px;}
.leg{display:flex;align-items:center;gap:5px;font-size:12px;color:#666;}
.leg-dot{width:10px;height:10px;border-radius:50%;}

/* CALENDARIO */
.cal-card{background:#fff;border-radius:16px;margin:0 14px;border:1px solid #eaecf2;overflow:hidden;}
.cal-nav{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 10px;}
.cal-nav h3{font-size:15px;font-weight:700;color:#1a1a2e;}
.cal-nav button{background:#f4f6fb;border:none;border-radius:10px;width:32px;height:32px;cursor:pointer;font-size:16px;color:#555;display:flex;align-items:center;justify-content:center;}
.cal-head{display:grid;grid-template-columns:repeat(7,1fr);padding:0 8px;}
.cal-head span{text-align:center;font-size:11px;color:#aaa;padding:4px 0;font-weight:600;}
.cal-head .ss{color:#3b82f6;}
.calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;padding:4px 8px 12px;}
.day{border-radius:8px;padding:4px 2px;min-height:52px;background:#fafafa;border:1px solid #f0f2f7;}
.day.outro-mes{opacity:.2;}
.day.hoje{border:2px solid #3b82f6;background:#eff6ff;}
.day.ss-day{background:#f0f5ff;}
.day-num{font-size:11px;font-weight:600;color:#333;text-align:center;margin-bottom:2px;}
.day.hoje .day-num{color:#1d4ed8;}
.day.ss-day .day-num{color:#3b82f6;}
.badge{font-size:8px;font-weight:700;border-radius:3px;padding:1px 3px;display:block;text-align:center;margin:1px 1px 0;}

/* NOTIFICAÇÕES */
.notif-card{background:#fff;border-radius:16px;margin:0 14px;border:1px solid #eaecf2;overflow:hidden;}
.notif-row{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid #f0f2f7;}
.notif-row:last-child{border-bottom:none;}
.notif-txt .nt{font-size:14px;font-weight:500;color:#1a1a2e;}
.notif-txt .ns{font-size:12px;color:#999;margin-top:2px;}
.toggle{position:relative;width:46px;height:26px;}
.toggle input{opacity:0;width:0;height:0;}
.slider{position:absolute;inset:0;background:#dde1ea;border-radius:13px;cursor:pointer;transition:.25s;}
.toggle input:checked+.slider{background:#3b82f6;}
.slider::after{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.25s;box-shadow:0 1px 4px rgba(0,0,0,.18);}
.toggle input:checked+.slider::after{transform:translateX(20px);}

.notif-btn{width:calc(100% - 28px);margin:14px;padding:14px;border-radius:14px;background:#3b82f6;border:none;color:#fff;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;}
.notif-btn:active{opacity:.85;}
.notif-btn.success{background:#22c55e;}
.notif-btn.error{background:#ef4444;}
.notif-status{text-align:center;font-size:12px;color:#888;padding:0 14px 14px;}

/* INSTALAR */
.install-banner{background:linear-gradient(135deg,#3b82f6,#6366f1);border-radius:16px;margin:16px 14px 0;padding:16px;display:flex;align-items:center;gap:14px;}
.install-icon{font-size:32px;}
.install-txt .it{font-size:14px;font-weight:700;color:#fff;}
.install-txt .is{font-size:12px;color:rgba(255,255,255,.8);margin-top:2px;}
.install-btn{margin-left:auto;background:rgba(255,255,255,.2);border:1.5px solid rgba(255,255,255,.5);border-radius:10px;color:#fff;font-size:13px;font-weight:600;padding:8px 14px;cursor:pointer;white-space:nowrap;flex-shrink:0;}
.install-btn:active{background:rgba(255,255,255,.35);}

/* MODAL */
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:100;align-items:flex-end;justify-content:center;}
.modal-overlay.open{display:flex;}
.modal-box{background:#fff;border-radius:24px 24px 0 0;padding:20px 20px 36px;width:100%;max-width:430px;}
.modal-box h3{font-size:17px;font-weight:700;color:#1a1a2e;margin-bottom:16px;text-align:center;}
.cor-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:18px;}
.cor-btn{border:2.5px solid #eaecf2;border-radius:14px;padding:14px 10px;cursor:pointer;display:flex;align-items:center;gap:10px;font-size:15px;font-weight:600;background:#fafafa;color:#333;transition:.15s;}
.cor-btn.ativa{background:#f0f6ff;border-color:var(--c);}
.modal-actions{display:flex;gap:10px;}
.modal-actions button{flex:1;padding:14px;border-radius:14px;font-size:15px;font-weight:600;cursor:pointer;}
.btn-cancel{background:#f4f6fb;border:none;color:#666;}
.btn-save{background:#3b82f6;border:none;color:#fff;}
</style>
</head>
<body>

<div class="app">

  <!-- TOPBAR -->
  <div class="topbar">
    <div class="topbar-title">⏰ Escala 6x2</div>
    <div class="topbar-right">
      <button class="icon-btn" onclick="abrirModal()" title="Minha cor">👤</button>
    </div>
  </div>

  <!-- MINHA COR BANNER -->
  <div class="minha-cor-banner" id="minhaCorBanner" style="margin:16px 14px 0;">
    <div class="minha-cor-info">
      <div class="minha-cor-dot" id="minhaCorDot"></div>
      <div>
        <div class="minha-cor-label">Minha cor</div>
        <div class="minha-cor-nome" id="minhaCorNome"></div>
        <div class="minha-cor-folga" id="minhaCorFolga"></div>
      </div>
    </div>
  </div>

  <!-- ALERTA -->
  <div id="alertaBanner" style="display:none;"></div>

  <!-- HOJE -->
  <div class="section">
    <div class="section-title">Hoje</div>
    <div class="hoje-grid">
      <div class="stat-card">
        <div class="stat-lbl">Trabalhando</div>
        <div class="stat-val" id="hojeTrabalha"></div>
      </div>
      <div class="stat-card">
        <div class="stat-lbl">Folgando</div>
        <div class="stat-val" id="hojeFolga"></div>
      </div>
    </div>
  </div>

  <!-- LEGENDA -->
  <div class="legenda">
    <div class="leg"><div class="leg-dot" style="background:#3b82f6"></div>Azul</div>
    <div class="leg"><div class="leg-dot" style="background:#22c55e"></div>Verde</div>
    <div class="leg"><div class="leg-dot" style="background:#eab308"></div>Amarelo</div>
    <div class="leg"><div class="leg-dot" style="background:#ef4444"></div>Vermelho</div>
  </div>

  <!-- CALENDÁRIO -->
  <div class="section" style="padding-bottom:0;">
    <div class="section-title">Calendário</div>
  </div>
  <div class="cal-card">
    <div class="cal-nav">
      <button onclick="mudarMes(-1)">&#8249;</button>
      <h3 id="tituloMes"></h3>
      <button onclick="mudarMes(1)">&#8250;</button>
    </div>
    <div class="cal-head">
      <span class="ss">D</span><span>S</span><span>T</span><span>Q</span><span>Q</span><span>S</span><span class="ss">S</span>
    </div>
    <div class="calendar" id="calendar"></div>
  </div>

  <!-- NOTIFICAÇÕES -->
  <div class="section" style="padding-top:20px;">
    <div class="section-title">Notificações</div>
  </div>
  <div class="notif-card">
    <div class="notif-row">
      <div class="notif-txt"><div class="nt">Folga amanhã</div><div class="ns">Aviso no dia anterior</div></div>
      <label class="toggle"><input type="checkbox" id="togAmanha" checked><span class="slider"></span></label>
    </div>
    <div class="notif-row">
      <div class="notif-txt"><div class="nt">2 dias antes da folga</div><div class="ns">Aviso antecipado</div></div>
      <label class="toggle"><input type="checkbox" id="tog2dias" checked><span class="slider"></span></label>
    </div>
    <div class="notif-row">
      <div class="notif-txt"><div class="nt">Dia de folga</div><div class="ns">Lembrete pela manhã</div></div>
      <label class="toggle"><input type="checkbox" id="togHoje" checked><span class="slider"></span></label>
    </div>
  </div>
  <button class="notif-btn" id="notifBtn" onclick="ativarNotificacoes()">🔔 Ativar notificações</button>
  <div class="notif-status" id="notifStatus"></div>

  <!-- INSTALAR -->
  <div class="install-banner" id="installBanner" style="display:none;">
    <div class="install-icon">📲</div>
    <div class="install-txt">
      <div class="it">Instalar na tela inicial</div>
      <div class="is">Use como um app de verdade, offline</div>
    </div>
    <button class="install-btn" onclick="instalarApp()">Instalar</button>
  </div>

</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay" onclick="fecharModalSeFora(event)">
  <div class="modal-box">
    <h3>Qual é a sua cor?</h3>
    <div class="cor-grid" id="corGrid"></div>
    <div class="modal-actions">
      <button class="btn-cancel" onclick="fecharModal()">Cancelar</button>
      <button class="btn-save" onclick="salvarCor()">Salvar</button>
    </div>
  </div>
</div>

<script>
const CORES={
  azul:    {cor:'#3b82f6',bg:'#1d4ed8',label:'Azul',   offset:0},
  verde:   {cor:'#22c55e',bg:'#15803d',label:'Verde',  offset:2},
  amarelo: {cor:'#eab308',bg:'#a16207',label:'Amarelo',offset:4},
  vermelho:{cor:'#ef4444',bg:'#b91c1c',label:'Vermelho',offset:6}
};
const ORDEM=['azul','verde','amarelo','vermelho'];
const MESES=['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
const REF=new Date(2026,4,15);

let minhaCor=localStorage.getItem('minhaCor')||'azul';
let corTemp=minhaCor;
let mesAtual=new Date().getMonth();
let anoAtual=new Date().getFullYear();
let deferredPrompt=null;

window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault(); deferredPrompt=e;
  document.getElementById('installBanner').style.display='flex';
});

function instalarApp(){
  if(deferredPrompt){deferredPrompt.prompt();deferredPrompt=null;document.getElementById('installBanner').style.display='none';}
}

function diffDias(d){
  const ref=Date.UTC(REF.getFullYear(),REF.getMonth(),REF.getDate());
  const tgt=Date.UTC(d.getFullYear(),d.getMonth(),d.getDate());
  return Math.round((tgt-ref)/86400000);
}
function statusDia(data){
  const ciclo=((diffDias(data)%8)+8)%8;
  const folgando=[],trabalhando=[];
  ORDEM.forEach(c=>{const o=CORES[c].offset;(ciclo===o||ciclo===o+1?folgando:trabalhando).push(c);});
  return{folgando,trabalhando};
}
function proximaFolga(cor){
  const hoje=new Date();
  for(let i=0;i<=30;i++){
    const d=new Date(hoje);d.setDate(hoje.getDate()+i);
    if(statusDia(d).folgando.includes(cor))return{data:d,dias:i};
  }
  return null;
}

function buildCorGrid(){
  const g=document.getElementById('corGrid');g.innerHTML='';
  ORDEM.forEach(c=>{
    const b=document.createElement('button');
    b.className='cor-btn'+(corTemp===c?' ativa':'');
    b.style.setProperty('--c',CORES[c].cor);
    b.innerHTML=`<span style="width:20px;height:20px;border-radius:50%;background:${CORES[c].cor};display:inline-block;"></span>${CORES[c].label}`;
    b.onclick=()=>{corTemp=c;buildCorGrid();};
    g.appendChild(b);
  });
}
function abrirModal(){corTemp=minhaCor;buildCorGrid();document.getElementById('modalOverlay').classList.add('open');}
function fecharModal(){document.getElementById('modalOverlay').classList.remove('open');}
function fecharModalSeFora(e){if(e.target===document.getElementById('modalOverlay'))fecharModal();}
function salvarCor(){minhaCor=corTemp;localStorage.setItem('minhaCor',minhaCor);fecharModal();render();}

function render(){
  const hoje=new Date();
  const {folgando,trabalhando}=statusDia(hoje);
  const c=CORES[minhaCor];
  const pf=proximaFolga(minhaCor);

  // Banner minha cor
  const banner=document.getElementById('minhaCorBanner');
  banner.style.background=c.cor;
  document.getElementById('minhaCorDot').style.background='rgba(255,255,255,.25)';
  document.getElementById('minhaCorNome').textContent=c.label;
  let folgaTxt='';
  if(pf){
    if(pf.dias===0)folgaTxt='🎉 Hoje você está de folga!';
    else if(pf.dias===1)folgaTxt='🔜 Folga amanhã!';
    else folgaTxt=`📅 Folga em ${pf.dias} dias (${pf.data.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})})`;
  }
  document.getElementById('minhaCorFolga').textContent=folgaTxt;

  // Alerta
  const alertDiv=document.getElementById('alertaBanner');
  if(pf&&pf.dias<=2){
    const msgs=['🎉 Hoje é seu dia de folga! Aproveite!','🔜 Sua folga começa amanhã!','📅 Sua folga começa em 2 dias!'];
    alertDiv.style.display='block';
    alertDiv.innerHTML=`<div class="alert-banner" style="background:${c.cor}18;border:1.5px solid ${c.cor}44;">
      <div class="alert-icon">🔔</div>
      <div><div class="alert-title" style="color:${c.bg};">${msgs[pf.dias]}</div>
      <div class="alert-sub" style="color:${c.bg};">Sua cor: ${c.label}</div></div></div>`;
  } else {
    alertDiv.style.display='none';
  }

  // Hoje trabalhando / folgando
  document.getElementById('hojeTrabalha').innerHTML=trabalhando.map(cor=>
    `<div class="cor-tag"><span class="cor-dot" style="background:${CORES[cor].cor}"></span>${CORES[cor].label}</div>`).join('');
  document.getElementById('hojeFolga').innerHTML=folgando.map(cor=>
    `<div class="cor-tag"><span class="cor-dot" style="background:${CORES[cor].cor}"></span>${CORES[cor].label}</div>`).join('');

  renderCal();
}

function renderCal(){
  document.getElementById('tituloMes').textContent=`${MESES[mesAtual]} ${anoAtual}`;
  const hoje=new Date();
  const cal=document.getElementById('calendar');cal.innerHTML='';
  const primeiro=new Date(anoAtual,mesAtual,1);
  const ultimo=new Date(anoAtual,mesAtual+1,0);
  const startDow=primeiro.getDay();

  function criarDia(data,outroMes){
    const div=document.createElement('div');
    div.className='day'+(outroMes?' outro-mes':'');
    const dow=data.getDay();
    if(dow===0||dow===6)div.classList.add('ss-day');
    const isHoje=data.toDateString()===hoje.toDateString();
    if(isHoje)div.classList.add('hoje');
    const {folgando}=statusDia(data);
    let html=`<div class="day-num">${data.getDate()}</div>`;
    folgando.forEach(c=>{
      const mine=c===minhaCor;
      html+=`<span class="badge" style="background:${CORES[c].cor}${mine?'':'22'};color:${mine?'#fff':CORES[c].cor};">${CORES[c].label[0]}</span>`;
    });
    div.innerHTML=html;return div;
  }

  for(let i=0;i<startDow;i++){const d=new Date(anoAtual,mesAtual,1-(startDow-i));cal.appendChild(criarDia(d,true));}
  for(let d=1;d<=ultimo.getDate();d++)cal.appendChild(criarDia(new Date(anoAtual,mesAtual,d),false));
  const resto=(cal.children.length%7===0)?0:7-(cal.children.length%7);
  for(let i=1;i<=resto;i++)cal.appendChild(criarDia(new Date(anoAtual,mesAtual+1,i),true));
}

function mudarMes(dir){
  mesAtual+=dir;
  if(mesAtual>11){mesAtual=0;anoAtual++;}
  if(mesAtual<0){mesAtual=11;anoAtual--;}
  renderCal();
}

async function ativarNotificacoes(){
  const btn=document.getElementById('notifBtn');
  const status=document.getElementById('notifStatus');
  if(!('Notification' in window)||!('serviceWorker' in navigator)){
    status.textContent='Seu navegador não suporta notificações push.';return;
  }
  const perm=await Notification.requestPermission();
  if(perm==='granted'){
    btn.className='notif-btn success';
    btn.textContent='✅ Notificações ativadas!';
    const pf=proximaFolga(minhaCor);
    const c=CORES[minhaCor];
    const tog0=document.getElementById('togHoje').checked;
    const tog1=document.getElementById('togAmanha').checked;
    const tog2=document.getElementById('tog2dias').checked;
    let msg='';
    if(pf){
      if(pf.dias===0&&tog0){new Notification('🎉 Dia de folga!',{body:`Hoje é sua folga, ${c.label}! Aproveite!`,tag:'escala-folga'});msg=`Você está de folga hoje!`;}
      else if(pf.dias===1&&tog1){new Notification('🔜 Folga amanhã!',{body:`Sua folga (${c.label}) começa amanhã!`,tag:'escala-folga'});msg=`Notificação enviada: folga amanhã!`;}
      else if(pf.dias===2&&tog2){new Notification('📅 Folga em 2 dias!',{body:`Prepare-se! Folga ${c.label} em 2 dias.`,tag:'escala-folga'});msg=`Notificação enviada: folga em 2 dias!`;}
      else{msg=`Próxima folga em ${pf.dias} dias. Você receberá avisos automáticos quando chegar perto.`;}
    }
    status.textContent=msg;

    // Agendar verificação diária via SW
    if('serviceWorker' in navigator){
      navigator.serviceWorker.ready.then(sw=>{
        sw.active&&sw.active.postMessage({type:'AGENDAR',minhaCor,togHoje:tog0,togAmanha:tog1,tog2dias:tog2});
      });
    }
  } else if(perm==='denied'){
    btn.className='notif-btn error';
    btn.textContent='❌ Permissão negada';
    status.textContent='Ative nas configurações do celular > Notificações > seu navegador.';
  }
}

// Registrar SW
if('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js').catch(()=>{});
}

render();
</script>
</body>
</html>
